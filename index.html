const data=JSON.parse(document.getElementById('catalog-data').textContent),$=id=>document.getElementById(id);let category='ALL',mode='both';const total=data.items.length;const counts=data.items.reduce((a,r)=>(a[r.category]=(a[r.category]||0)+1,a),{});const isPrivate=data.edition==='private';

function nav(){const root=$('categories');root.replaceChildren();for(const [key,labels]of [['ALL',['全部項目','All entries']],...Object.entries(data.categories)]){const b=el('button','cat'+(category===key?' active':''));b.type='button';b.setAttribute('aria-pressed',String(category===key));const span=el('span','',mode==='en'?labels[1]:labels[0]);if(mode==='both'){span.append(el('br'),el('small','',labels[1]))}b.append(span,el('span','',String(key==='ALL'?total:counts[key]||0)));b.onclick=()=>{category=key;nav();render()};root.append(b)}}
function render(){const q=$('search').value.toLowerCase().trim(),origin=$('origin').value,priority=$('priority').value;let rows=data.items.filter(r=>(category==='ALL'||r.category===category)&&(origin==='all'||r.origin===origin)&&(priority==='all'||r.priority===priority)&&[r.name,r.zh,r.en,r.language,r.license,...(r.topics||[]),...data.categories[r.category]].join(' ').toLowerCase().includes(q));const sort=$('sort').value;if(sort==='stars')rows.sort((a,b)=>b.stars-a.stars);if(sort==='recent')rows.sort((a,b)=>b.pushed.localeCompare(a.pushed));if(sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='new')rows.sort((a,b)=>(b.origin==='discovered')-(a.origin==='discovered'));$('count').textContent=tr(`顯示 ${rows.length} / ${total} 個項目`,`${rows.length} of ${total} entries`);const root=$('cards');root.replaceChildren();for(const r of rows){const card=el('article','card'),kick=el('div','kicker');kick.append(el('span','',data.categories[r.category][mode==='en'?1:0]),el('span','',`★ ${r.stars.toLocaleString()}`));card.append(kick);const h=el('h3');h.append(link(r.name,r.url));card.append(h);const badge=el('div','priority',r.origin==='discovered'?tr('新發現','Discovered')+' · '+r.priority:tr('原有收藏','Saved star'));card.append(badge);const desc=el('div','desc');if(mode!=='en')desc.append(el('p','zh',r.zh));if(mode!=='zh')desc.append(el('p','en',r.en));if(r.note_zh&&mode!=='en')desc.append(el('p','note_zh',r.note_zh));if(r.note_en&&mode!=='zh')desc.append(el('p','note_en',r.note_en));card.append(desc);const meta=el('div','meta');meta.append(el('span','',r.language),el('span','',r.license),el('span','',tr('最後推送','Last push')+' '+r.pushed));if(r.archived)meta.append(el('span','archived',tr('已封存','Archived')));card.append(meta);const source=el('div','source');source.append(link(tr('專案','Repository')+' ↗',r.url));if(r.readme_url){source.append(document.createTextNode(' · '),link('README ↗',r.url+'#readme'))}source.append(document.createTextNode(' · '),link(tr('提交紀錄','Co function localize(){document.documentElement.lang=mode==='en'?'en':'zh-Hant';document.title='Jacky’s Star Atlas'+(isPrivate?' · Private':'');$('repo-link').href='https://github.com/jacbus1/'+(isPrivate?'star-atlas-private':'star-atlas');$('intro').textContent=tr('把收藏變成可用的工具箱。探索用途、授權與維護線索。','Turn saved repositories into a useful toolkit. Explore purpose, licensing and maintenance evidence.');$('edition').textContent=isPrivate?tr('私人完整版 · 請勿公開部署','Private master · Do not deploy publicly'):tr('公開精選版 · 收藏與新發現','Public collection · Saved stars and discoveries');$('total').textContent=total;$('cat-total').textContent=Object.keys(data.categories).length;$('new-total').textContent=data.items.filter(r=>r.origin==='discovered').length;$('total-label').textContent=tr('專案數量','Repositories');$('cat-label').textContent=tr('主分類','Categories');$('new-label').textContent=tr('本輪新增','New discoveries');$('cat-heading').textContent=tr('分類','Collections');$('snapshot').textContent=tr('核查快照','Review snapshot')+' · '+data.snapshot;$('search').placeholder=tr('搜尋名稱、用途、主題…','Search names, purposes, topics…');$('reset').textContent=tr('重設','Reset');options('sort',[['new','新增優先','Discoveries first'],['starred','原有順序','Original order'],['stars','最多 Stars','Most stars'],['recent','最近推送','Last push'],['name','名稱 A–Z','Name A–Z']]);options('origin',[['all','全部來源','All origins'],['starred','原有收藏','Saved stars'],['discovered','新發現','Discoveries']]);options('priority',[['all','全部優先級','All priorities'],['P1','P1 優先評估','P1 Evaluate first'],['P2','P2 按需評估','P2 As needed'],['Reference','歷史／低更新參考','Reference'],['Exploratory','探索性研究','Exploratory'],['Saved','原有收藏','Saved']]);$('notes-title').textContent=tr('閱讀說明','Reading notes');$('notes-text').textContent=tr('新增項目核對官方 metadata 與 README 片段，未安裝或執行。最後推送不是維護品質評分。公開程式碼不等於免費商用；模型 API、資料與主機可能另收費。','New entries were reviewed through official metadata and README excerpts, not installed or executed. Last push is not a maintenance-quality score. Public code does not $('search').addEventListener('input',render);for(const id of ['sort','origin','priority'])$(id).addEventListener('change',render);$('reset').onclick=()=>{category='ALL';$('search').value='';$('origin').value='all';$('priority').value='all';$('sort').value='new';nav();render()};$('language').addEventListener('change',()=>{mode=$('language').value;try{localStorage.setItem('star-atlas-language',mode)}catch{}localize()});try{const saved=localStorage.getItem('star-atlas-language');if(['en','zh','both'].includes(saved)){mode=saved;$('language').value=mode}}catch{}localize();
